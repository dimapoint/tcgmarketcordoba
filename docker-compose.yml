services:

  # ── Go REST API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tcgmarketcordoba-api:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env          # copy from backend/.env.example — never commit secrets
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]   # see note below *
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge

# ── Notes ────────────────────────────────────────────────────────────────────
# * The scratch-based image has no shell, so healthcheck uses the binary itself.
#   Alternatively expose GET /health and use a sidecar or wget from a debug build:
#
#   healthcheck:
#     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
#
#   For that to work switch the final stage to alpine:3.20 instead of scratch.
#
# * Secrets: copy backend/.env.example → backend/.env and fill in real values.
#   Never commit .env files.  See .gitignore.
#
# * To run:
#     docker compose up --build
#     docker compose up --pull always   # pull latest base images first
