services:

  # ── Full-stack: Go API + Flutter web (single container) ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcgmarketcordoba:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env          # copy from backend/.env.example — never commit secrets
    environment:
      PORT: "8080"
      WEB_DIR: "/web"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend

  # ── API-only (no Flutter web, for backend dev / CI) ───────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tcgmarketcordoba-api:local
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - api-only
    networks:
      - frontend

networks:
  frontend:
    driver: bridge

# ── Notes ─────────────────────────────────────────────────────────────────────
#
# Run the full-stack image (API + Flutter web):
#   docker compose up --build
#   docker compose up --pull always   # pull updated base images first
#
# Run only the Go API (no Flutter web, port 8081):
#   docker compose --profile api-only up --build api
#
# Secrets:
#   cp backend/.env.example backend/.env  # then fill in real values
#   Never commit .env files  (covered by .gitignore)
#
# Production tip:
#   Put a reverse proxy (Caddy, nginx, Traefik) in front of this container
#   to handle TLS termination and serve static assets with long-lived
#   cache headers (flutter build web emits content-hashed filenames).
