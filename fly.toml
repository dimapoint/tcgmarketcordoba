# Fly.io: API Go + web de Flutter en una sola app.
# Deploy: ./deploy.ps1 (buildea flutter web con la API_URL de producción y corre fly deploy)

app = "tcgmarketcordoba"
primary_region = "gru"

[env]
  PORT = "8080"
  WEB_DIR = "/web"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
