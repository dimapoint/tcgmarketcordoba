name: tcgmarketcordoba
description: "TCGMarket Córdoba — peer-to-peer Riftbound TCG card marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.1
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.1.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  share_plus: ^13.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
